name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename release artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "fintrack-${GITHUB_REF_NAME}-release.apk"
          sha256sum "fintrack-${GITHUB_REF_NAME}-release.apk" > "fintrack-${GITHUB_REF_NAME}-release.apk.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fintrack-${{ github.ref_name }}-release.apk
            fintrack-${{ github.ref_name }}-release.apk.sha256
